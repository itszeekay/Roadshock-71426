# SPDX-License-Identifier: MIT
#
# ASR5601S (QFN-48) SWD target for OpenOCD.
#
# This file is read-only in practice: the project only ever sends init,
# halt, mdw and dump_image to the target.
#
# Wiring:
#   ST-Link SWCLK -> QFN pin 37 (P06)
#   ST-Link SWDIO -> QFN pin 36 (P07)
#   ST-Link GND   -> board GND
#   ST-Link 3.3V  -> board 3.3 V (sense only, the panel powers itself)
#
# Usage:
#   openocd -f interface/stlink.cfg -f asr5601_swd.cfg -c "init" -c "halt"

# The interface file is passed on the command line and must come first:
#   openocd -f interface/stlink.cfg -f asr5601_swd.cfg
transport select swd

# Start slow. 330 ohm series parts or hand-soldered magnet wire both
# degrade signal integrity, and 100 kHz is enough for a one-off read.
adapter speed 100

if {![info exists CHIPNAME]} {
    set CHIPNAME asr5601s
}

# ARM Cortex-M0+ ADIv5 debug port IDCODE.
if {![info exists CPUTAPID]} {
    set CPUTAPID 0x0bb11477
}

swd newdap $CHIPNAME cpu -expected-id $CPUTAPID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu

set _TARGETNAME $CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $CHIPNAME.dap -coreid 0

# 1 KB of SRAM as a scratch work area. The ASR5601S has 96 KB at 0x20000000.
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x400 -work-area-backup 0

cortex_m reset_config sysresetreq
